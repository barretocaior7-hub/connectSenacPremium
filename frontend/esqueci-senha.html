<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Recuperar Palavra-passe</title>
    <!-- Favicon / Meta -->
    <meta name="theme-color" content="#004a8d">
    <link rel="icon" type="image/png" href="assets/logo-connect-senac.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Design System -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-main">

    <div class="auth-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-9 col-lg-6 col-xl-5">
                    
                    <div class="auth-card p-4 p-md-5 fade-in-up">
                        <img class="auth-page-logo" src="assets/logo-connect-senac.png" alt="Connect Senac">
                        
                        <!-- Cabeçalho -->
                        <div class="text-center mb-4">
                            <div class="auth-brand-badge mb-3">
                                <i class="bi bi-key-fill"></i> Recuperação de Acesso
                            </div>
                            <h2 class="fw-bold mb-2" style="color: var(--senac-blue);">Esqueceu a senha?</h2>
                            <p class="text-muted small">Insira o seu e-mail cadastrado. Enviaremos as instruções para redefinir o seu acesso à plataforma.</p>
                        </div>

                        <!-- Formulário -->
                        <form id="formEsqueci" novalidate>
                            
                            <div class="form-floating mb-3">
                                <input 
                                    type="email" 
                                    class="form-control" 
                                    id="emailRecuperacao" 
                                    placeholder="name@example.com" 
                                    required 
                                    autocomplete="email"
                                    aria-label="O seu E-mail"
                                >
                                <label for="emailRecuperacao"><i class="bi bi-envelope me-1"></i> O seu E-mail cadastrado</label>
                            </div>

                            <div id="msgRecuperacao" class="small text-center mb-3 fw-bold"></div>

                            <button type="submit" class="btn btn-brand w-100 py-3 mb-2 shadow-sm" id="btnSubmitEsqueci">
                                <i class="bi bi-send me-1"></i> Enviar Link de Recuperação
                            </button>
                            
                            <a href="index.html" class="btn btn-light-custom w-100 py-2">
                                <i class="bi bi-arrow-left me-1"></i> Voltar ao Login
                            </a>
                        </form>

                    </div>

                    <div class="text-center mt-4 text-muted small">
                        <span>&copy; Senac - Serviço Nacional de Aprendizagem Comercial</span>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui-effects.js"></script>
</body>
</html>
