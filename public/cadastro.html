<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Criar Conta</title>
    <!-- Favicon / Meta -->
    <meta name="theme-color" content="#004a8d">
    <link rel="icon" type="image/png" href="assets/logo-connect-senac.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Design System -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#004a8d">
    <meta property="og:title" content="Connect Senac — Seja Modelo em Cursos Práticos">
    <meta property="og:description" content="Atendimentos 100% gratuitos e supervisionados por docentes do SENAC. Agende sua vaga online!">
    <meta property="og:image" content="/assets/logo-connect-senac.png">
    <meta property="og:type" content="website">
</head>
<body class="bg-main">

    <div class="auth-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8 col-xl-7">
                    
                    <div class="auth-card p-4 p-md-5 fade-in-up">
                        <img class="auth-page-logo" src="assets/logo-connect-senac.png" alt="Connect Senac">
                        
                        <!-- Cabeçalho -->
                        <div class="text-center mb-4">
                            <div class="auth-brand-badge mb-3">
                                <i class="bi bi-person-plus-fill"></i> Novo Cadastro
                            </div>
                            <h2 class="fw-bold mb-1" style="color: var(--senac-blue);">Criar Nova Conta</h2>
                            <p class="text-muted small">Preencha os dados abaixo para participar como modelo em nossas aulas práticas</p>
                        </div>

                        <!-- Formulário -->
                        <form id="formCadastro" novalidate>
                            
                            <!-- Bloco 1: Dados Pessoais -->
                            <div class="mb-4">
                                <h6 class="fw-bold text-uppercase small text-muted mb-3" style="letter-spacing: 0.5px;">
                                    <i class="bi bi-person-lines-fill me-1 text-primary"></i> 1. Informações Pessoais
                                </h6>
                                
                                <div class="form-floating mb-3">
                                    <input 
                                        type="text" 
                                        class="form-control" 
                                        id="nome" 
                                        placeholder="Nome Completo" 
                                        required
                                        autocomplete="name"
                                        aria-label="Nome Completo"
                                    >
                                    <label for="nome"><i class="bi bi-person me-1"></i> Nome Completo</label>
                                </div>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input 
                                                type="email" 
                                                class="form-control" 
                                                id="email" 
                                                placeholder="E-mail" 
                                                required
                                                autocomplete="email"
                                                aria-label="E-mail"
                                            >
                                            <label for="email"><i class="bi bi-envelope me-1"></i> E-mail</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="input-group">
                                            <div class="form-floating" style="max-width: 82px; flex-shrink: 0;">
                                                <select class="form-select px-2 text-center" id="ddiPais" aria-label="DDI" style="font-size: 0.9rem;">
                                                    <option value="+55" selected>+55</option>
                                                    <option value="+1">+1</option>
                                                    <option value="+351">+351</option>
                                                    <option value="+34">+34</option>
                                                    <option value="+54">+54</option>
                                                    <option value="+44">+44</option>
                                                    <option value="+33">+33</option>
                                                    <option value="+49">+49</option>
                                                    <option value="+39">+39</option>
                                                    <option value="+598">+598</option>
                                                    <option value="+595">+595</option>
                                                    <option value="+81">+81</option>
                                                </select>
                                                <label for="ddiPais" class="px-2">DDI</label>
                                            </div>
                                            <div class="form-floating flex-grow-1">
                                                <input 
                                                    type="tel" 
                                                    class="form-control" 
                                                    id="telefone" 
                                                    placeholder="(DDD) 9XXXX-XXXX" 
                                                    required
                                                    maxlength="15"
                                                    autocomplete="tel"
                                                    aria-label="Telefone WhatsApp"
                                                >
                                                <label for="telefone"><i class="bi bi-whatsapp me-1 text-success"></i> WhatsApp</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Bloco 2: Segurança -->
                            <div class="mb-4">
                                <h6 class="fw-bold text-uppercase small text-muted mb-3" style="letter-spacing: 0.5px;">
                                    <i class="bi bi-shield-lock me-1 text-primary"></i> 2. Segurança e Senha
                                </h6>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <div class="form-floating input-password-wrapper">
                                            <input 
                                                type="password" 
                                                class="form-control pe-5" 
                                                id="senha" 
                                                placeholder="Senha" 
                                                required
                                                autocomplete="new-password"
                                                aria-label="Senha"
                                            >
                                            <label for="senha"><i class="bi bi-lock me-1"></i> Senha</label>
                                            <button type="button" class="btn-toggle-password" id="btnToggleSenhaCad" aria-label="Mostrar ou ocultar senha">
                                                <i class="bi bi-eye" id="iconToggleSenhaCad"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating input-password-wrapper">
                                            <input 
                                                type="password" 
                                                class="form-control pe-5" 
                                                id="confirmar_senha" 
                                                placeholder="Confirmar Senha" 
                                                required
                                                autocomplete="new-password"
                                                aria-label="Confirmar Senha"
                                            >
                                            <label for="confirmar_senha"><i class="bi bi-shield-check me-1"></i> Confirmar</label>
                                            <button type="button" class="btn-toggle-password" id="btnToggleConfirmarCad" aria-label="Mostrar ou ocultar confirmação de senha">
                                                <i class="bi bi-eye" id="iconToggleConfirmarCad"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                                                                <div class="col-12 mt-2">
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <small class="text-muted" style="font-size: 0.75rem;">Segurança da senha:</small>
                                            <span id="passwordStrengthText" class="small fw-bold"></span>
                                        </div>
                                        <div class="password-strength-wrap">
                                            <div class="password-strength-bar" id="passwordStrengthBar"></div>
                                        </div>
                                        <div id="passwordMatchFeedback" class="mt-1"></div>
                                    </div>
                            <!-- Bloco 3: LGPD & Termos -->
                            <div class="p-3 bg-light rounded-3 mb-4 border">
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <span class="badge bg-primary text-white"><i class="bi bi-shield-shaded"></i> LGPD</span>
                                    <h6 class="fw-bold mb-0 small text-secondary">Privacidade e Termos Legais</h6>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="termoUso" required>
                                    <label class="form-check-label small" for="termoUso">
                                        Li e aceito os <a href="#" class="text-decoration-none fw-semibold">Termos de Uso</a> e a <a href="#" class="text-decoration-none fw-semibold">Política de Privacidade</a> do SENAC.*
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="termoImagem">
                                    <label class="form-check-label small text-muted" for="termoImagem">
                                        Autorizo o uso de imagens dos procedimentos para fins acadêmicos e portfólio da turma (Opcional).
                                    </label>
                                </div>
                            </div>

                            <!-- Mensagens de Feedback -->
                            <div id="mensagemCadastro" class="mb-3 text-center small fw-bold"></div>

                            <!-- Botão de Ação -->
                            <button type="submit" class="btn btn-brand w-100 py-3 mb-3 shadow-sm" id="btnSubmitCadastro">
                                <i class="bi bi-check2-circle me-1"></i> Finalizar Cadastro
                            </button>
                        </form>

                        <!-- Rodapé do Card -->
                        <div class="text-center pt-3 border-top">
                            <a href="login.html" id="linkLogin" class="text-decoration-none text-muted small">
                                Já tem uma conta? <span class="fw-bold" style="color: var(--senac-blue);">Faça Login <i class="bi bi-arrow-right-short"></i></span>
                            </a>
                        </div>

                    </div>

                    <div class="text-center mt-4 text-muted small">
                        <span>&copy; Senac - Serviço Nacional de Aprendizagem Comercial</span>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui-effects.js"></script>
    <script src="js/accessibility.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script src="js/cookie-consent.js"></script>
    <script src="js/whatsapp-widget.js"></script>
    <script src="js/assistant-ia.js"></script>

</body>
</html>
