<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conheça os cursos, serviços e procedimentos práticos disponíveis no Connect Senac.">
  <title>Cursos e serviços | Connect Senac</title>
  <link rel="canonical" href="/cursos">
  <link rel="icon" type="image/png" href="/assets/logo-connect-senac.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#004a8d">
    <meta property="og:title" content="Connect Senac — Seja Modelo em Cursos Práticos">
    <meta property="og:description" content="Atendimentos 100% gratuitos e supervisionados por docentes do SENAC. Agende sua vaga online!">
    <meta property="og:image" content="/assets/logo-connect-senac.png">
    <meta property="og:type" content="website">
</head>
<body class="bg-main public-courses-page">
  <nav class="navbar navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/cursos"><img class="navbar-brand-logo" src="/assets/logo-connect-senac.png" alt="Connect Senac"><span>Connect Senac</span></a>
      <div class="d-flex gap-2" id="publicAuthActions">
        <a class="btn btn-outline-light btn-sm" href="/index.html">Entrar</a>
        <a class="btn btn-orange btn-sm" href="/cadastro.html">Criar conta</a>
      </div>
    </div>
  </nav>
  <main class="container py-5">
    <header class="public-courses-hero">
      <span><i class="bi bi-stars"></i> Vitrine pública</span>
      <h1>Encontre uma experiência para você</h1>
      <p>Explore gratuitamente os procedimentos e atividades práticas supervisionadas do SENAC. Você só precisa entrar nsua conta quando decidir agendar.</p>
    </header>
    <section aria-labelledby="tituloCatalogo">
      <div class="section-header-custom mt-5"><h2 class="section-title" id="tituloCatalogo">Cursos disponíveis</h2></div>
      <div class="input-group search-bar-premium mb-4" style="max-width:420px"><span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span><input class="form-control border-start-0" id="publicCourseSearch" type="search" placeholder="Buscar curso ou procedimento" aria-label="Buscar curso"></div>
      <div class="row g-4" id="publicCourseList" aria-live="polite"><div class="col-12 text-center py-5"><span class="spinner-border"></span><p class="mt-3 text-muted">Carregando cursos...</p></div></div>
    </section>
  </main>
  <script src="/js/catalogo-publico.js"></script>
  <script src="/js/ui-effects.js"></script>
    <script src="js/accessibility.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script src="js/cookie-consent.js"></script>
    <script src="js/whatsapp-widget.js"></script>
    <script src="js/assistant-ia.js"></script>
