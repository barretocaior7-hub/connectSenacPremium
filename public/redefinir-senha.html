<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Criar Nova Senha</title>
    <!-- Favicon / Meta -->
    <meta name="theme-color" content="#004a8d">
    <link rel="icon" type="image/png" href="assets/logo-connect-senac.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Design System -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#004a8d">
    <meta property="og:title" content="Connect Senac — Seja Modelo em Cursos Práticos">
    <meta property="og:description" content="Atendimentos 100% gratuitos e supervisionados por docentes do SENAC. Agende sua vaga online!">
    <meta property="og:image" content="/assets/logo-connect-senac.png">
    <meta property="og:type" content="website">
</head>
<body class="bg-main">

    <div class="auth-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-9 col-lg-6 col-xl-5">
                    
                    <div class="auth-card p-4 p-md-5 fade-in-up">
                        <img class="auth-page-logo" src="assets/logo-connect-senac.png" alt="Connect Senac">
                        
                        <!-- Cabeçalho -->
                        <div class="text-center mb-4">
                            <div class="auth-brand-badge mb-3">
                                <i class="bi bi-shield-check"></i> Redefinição Segura
                            </div>
                            <h2 class="fw-bold mb-2" style="color: var(--senac-blue);">Nova Senha</h2>
                            <p class="text-muted small">Crie uma nova senha forte para aceder à sua conta no Connect Senac.</p>
                        </div>

                        <!-- Formulário -->
                        <form id="formRedefinir" novalidate>
                            
                            <div class="form-floating mb-3 input-password-wrapper">
                                <input 
                                    type="password" 
                                    class="form-control pe-5" 
                                    id="novaSenha" 
                                    placeholder="Nova Senha" 
                                    required
                                    autocomplete="new-password"
                                    aria-label="Nova Senha"
                                >
                                <label for="novaSenha"><i class="bi bi-lock me-1"></i> Nova Senha</label>
                                <button type="button" class="btn-toggle-password" id="btnToggleNovaSenha" aria-label="Mostrar ou ocultar senha">
                                    <i class="bi bi-eye" id="iconToggleNovaSenha"></i>
                                </button>
                            </div>

                            <div class="form-floating mb-3 input-password-wrapper">
                                <input 
                                    type="password" 
                                    class="form-control pe-5" 
                                    id="confirmarNovaSenha" 
                                    placeholder="Confirmar Senha" 
                                    required
                                    autocomplete="new-password"
                                    aria-label="Confirmar Nova Senha"
                                >
                                <label for="confirmarNovaSenha"><i class="bi bi-shield-lock me-1"></i> Confirmar Senha</label>
                                <button type="button" class="btn-toggle-password" id="btnToggleConfirmarNovaSenha" aria-label="Mostrar ou ocultar senha">
                                    <i class="bi bi-eye" id="iconToggleConfirmarNovaSenha"></i>
                                </button>
                            </div>

                            <div id="msgRedefinir" class="small text-center mb-3 fw-bold"></div>

                            <button type="submit" class="btn btn-brand w-100 py-3 mb-2 shadow-sm" id="btnSubmitRedefinir">
                                <i class="bi bi-check-lg me-1"></i> Atualizar Senha
                            </button>

                            <a href="login.html" class="btn btn-light-custom w-100 py-2">
                                <i class="bi bi-arrow-left me-1"></i> Voltar ao Login
                            </a>
                        </form>

                    </div>

                    <div class="text-center mt-4 text-muted small">
                        <span>&copy; Senac - Serviço Nacional de Aprendizagem Comercial</span>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui-effects.js"></script>
    <script src="js/accessibility.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script src="js/cookie-consent.js"></script>
    <script src="js/whatsapp-widget.js"></script>
    <script src="js/assistant-ia.js"></script>

</body>
</html>
